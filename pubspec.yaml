name: rydo_captain
description: RYDO Captain App - Driver Partner Application
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  
  # State Management
  provider: ^6.0.5
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.2
  
  # Maps & Location
  google_maps_flutter: ^2.5.0
  location: ^6.0.2
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  
  # Authentication & Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  
  # Real-time Communication
  socket_io_client: ^2.0.3+1
  
  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.1.14
  image_picker: ^1.0.4
  permission_handler: ^11.0.1
  
  # UI Components
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  lottie: ^2.7.0
  
  # Charts & Analytics
  fl_chart: ^0.64.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/rydo_captain_icon.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
